<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Depth legend QA</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main style="width: min(100% - 24px, 560px); margin: 40vh auto 0; border: 1px solid var(--tap-rule); background: #08090b;">
      <div class="depth-legend" aria-label="深度颜色与距离关系">
        <div class="depth-legend__scale">
          <span>近</span>
          <i aria-hidden="true"></i>
          <span>远</span>
        </div>
        <div class="depth-legend__values">
          <span>3.9180 disparity</span>
          <span>12.3047 disparity</span>
        </div>
      </div>
    </main>
  </body>
</html>
